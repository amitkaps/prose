name: release

# Push a `vX.Y.Z` tag → build, verify, and attach the installable tarball to a GitHub Release.
# Consumers install from the release asset URL until the package is published to a registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json version
        run: |
          v="$(node -p 'require("./package.json").version')"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }
      - run: pnpm run check
      - run: pnpm run test
      # `pnpm pack` runs `prepack` (the full build) first.
      - run: pnpm pack
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --title "$GITHUB_REF_NAME" --generate-notes
