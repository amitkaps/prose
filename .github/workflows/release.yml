# @prose
# # Release
#
# Pushing a `vX.Y.Z` tag runs the same checks as CI, then packs the tarball, attaches it to a GitHub
# Release and publishes it to npm. The tag must match `package.json`'s version.
#
# npm publishing uses trusted publishing (OIDC, with provenance): there is no token to store. The
# trusted publisher is set on npmjs.com once the package exists, so the first version is published
# by hand and this step skips a version that is already on the registry.

name: release

# Push a `vX.Y.Z` tag → build, verify, and attach the installable tarball to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json version
        run: |
          v="$(node -p 'require("./package.json").version')"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }
      - run: pnpm run check
      - run: pnpm run test
      # `pnpm pack` runs `prepack` (the full build) first.
      - run: pnpm pack
      # From a folder outside the repository: npm refuses to run in it, since `devEngines` names pnpm.
      - name: Publish to npm
        working-directory: ${{ runner.temp }}
        run: |
          v="$(node -p 'require(process.env.GITHUB_WORKSPACE + "/package.json").version')"
          if npm view "@amitkaps/prose@$v" version >/dev/null 2>&1; then
            echo "@amitkaps/prose@$v is already on npm"
          else
            npm publish "$GITHUB_WORKSPACE"/amitkaps-prose-*.tgz --provenance --access public
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --title "$GITHUB_REF_NAME" --generate-notes
