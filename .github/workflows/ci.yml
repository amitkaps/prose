# @prose
# # CI
#
# Runs on every pull request and every push to `main`. The `ci` job runs `verify`: format, lint
# and types, the tests, the build with publint, then the site. Branch protection requires that
# exact check name.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, named `ci`: branch protection requires this exact check name.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from package.json's `packageManager`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same script Cloudflare runs before each deploy: format, lint and types, the tests, the
      # library with publint, then the site.
      - run: pnpm run verify
