name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, named `ci`: branch protection requires this exact check name.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from package.json's `packageManager`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Format, lint, types (`vp check`) and Svelte diagnostics (`svelte-check`).
      - run: pnpm run check
      - run: pnpm run test
      # Library + client SPA + the client-bundle regression guard.
      - run: pnpm run build
