# @prose
# # CI
#
# One job, `ci`, on every pull request and every push to `main`: format, lint and types, the tests, then the
# build. Branch protection requires that exact check name. A second job, `node-24`, runs the tests on
# the previous LTS.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, named `ci`: branch protection requires this exact check name.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from package.json's `packageManager`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Format, lint and types.
      - run: pnpm run check
      - run: pnpm run test
      # The library.
      - run: pnpm run build

  # The oldest Node `engines` allows; not a required check.
  node-24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
