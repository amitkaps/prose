# pnpm 12 reads project settings from here (moved out of .npmrc).

# Supply-chain cooldown, in minutes. 0 tracks the newest releases; a real
# project wants 1440+ — see src/content/setup.md §5.
minimumReleaseAge: 0

# Dependencies allowed to run install scripts (native binaries).
allowBuilds:
  esbuild: true
  workerd: true

# Collapse every `vite` in the tree onto Vite+'s core build — see
# src/content/lessons.md. Bump this alongside the `vite-plus` devDependency.
overrides:
  'vite@*': 'npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0'
