# @prose
# # How the site is deployed
#
# Cloudflare builds this repository's own site from `main`. It serves it as a Worker with static
# assets, which are only the pages `prose build` writes, with no code.
#
# The Worker's build command is `pnpm run verify`, and its deploy command is `pnpm run ship`,
# which runs `wrangler deploy` and reads this file. The domain is set on the Worker in the
# dashboard, not here. The steps are in [development](docs/development.md#the-site).

name = "prose"
compatibility_date = "2026-10-01"

[assets]
directory = ".prose"
# Serve the site's own 404.html for any missing address.
not_found_handling = "404-page"
# Serve /src/store.ts from src/store.ts.html, with no redirect.
html_handling = "auto-trailing-slash"
