# @prose
# # pnpm workspace settings
#
# Not a multi-package workspace: this file only holds pnpm's install policy. `minimumReleaseAgeExclude` lets
# one freshly released dependency in past the age gate, and `overrides` pins every `vite` to Vite+'s core build.

minimumReleaseAgeExclude:
  - "@amitkaps/markz@0.1.1"
# Collapse every `vite` in the tree onto Vite+'s core build, which `vp pack` requires (same
# override as amitkaps/base). Bump this alongside the `vite-plus` devDependency.
overrides:
  "vite@*": "npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0"
